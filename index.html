<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maraki Juice and Salad — Shift & Stock System</title>
    <meta name="description" content="Maraki Juice and Salad shift reconciliation, stock inventory tracking, pending payments, and delivery accounts management system." />
    <meta name="theme-color" content="#F59E0B" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧃</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="color: red; padding: 20px; font-family: monospace; z-index: 9999; position: fixed; top: 0; left: 0; background: white; width: 100%; height: 100%;"><b>Runtime Error:</b><br/>' + e.message + '<br/><br/>' + e.filename + ':' + e.lineno + '<br/><br/>' + (e.error ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color: red; padding: 20px; font-family: monospace; z-index: 9999; position: fixed; top: 0; left: 0; background: white; width: 100%; height: 100%;"><b>Unhandled Promise Rejection:</b><br/>' + e.reason + '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
